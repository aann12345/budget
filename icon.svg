<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061628"/>
      <stop offset="55%" stop-color="#0A2040"/>
      <stop offset="100%" stop-color="#062038"/>
    </linearGradient>
    <linearGradient id="chartFill2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,122,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(0,122,255,0.00)"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(52,199,89,0.22)"/>
      <stop offset="100%" stop-color="rgba(52,199,89,0.00)"/>
    </linearGradient>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.07)"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <filter id="csh">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(255,160,0,0.4)"/>
    </filter>
    <clipPath id="clip">
      <rect width="512" height="512" rx="110"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="120" cy="140" r="180" fill="rgba(0,122,255,0.12)"/>
    <circle cx="390" cy="370" r="150" fill="rgba(52,199,89,0.07)"/>

    <!-- Chart area fill blue -->
    <path d="M0,320 L60,290 L120,300 L180,260 L240,240 L300,210 L360,190 L420,160 L480,130 L512,120 L512,512 L0,512 Z"
          fill="url(#chartFill2)" opacity="0.8"/>

    <!-- Chart area fill green -->
    <path d="M0,400 L80,380 L150,370 L220,340 L290,310 L360,290 L430,260 L512,240 L512,512 L0,512 Z"
          fill="url(#chartFill)" opacity="0.9"/>

    <!-- Grid lines -->
    <line x1="0" y1="200" x2="512" y2="200" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="0" y1="300" x2="512" y2="300" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="0" y1="400" x2="512" y2="400" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

    <!-- Chart line blue -->
    <polyline points="0,320 60,290 120,300 180,260 240,240 300,210 360,190 420,160 480,130 512,120"
      fill="none" stroke="rgba(0,122,255,0.75)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Chart line green -->
    <polyline points="0,400 80,380 150,370 220,340 290,310 360,290 430,260 512,240"
      fill="none" stroke="rgba(52,199,89,0.70)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dot blue peak -->
    <circle cx="480" cy="130" r="6" fill="#007AFF"/>
    <circle cx="480" cy="130" r="11" fill="rgba(0,122,255,0.28)"/>

    <!-- Dot green peak -->
    <circle cx="430" cy="260" r="6" fill="#34C759"/>
    <circle cx="430" cy="260" r="11" fill="rgba(52,199,89,0.25)"/>

    <!-- Wallet card -->
    <rect x="90" y="118" width="332" height="210" rx="28" fill="url(#walletGrad)" filter="url(#sh)"/>
    <rect x="90" y="118" width="332" height="210" rx="28" fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>

    <!-- Wallet header -->
    <rect x="90" y="118" width="332" height="60" rx="28" fill="rgba(255,255,255,0.08)"/>
    <rect x="90" y="152" width="332" height="26" fill="rgba(255,255,255,0.06)"/>

    <!-- Pocket -->
    <rect x="306" y="170" width="116" height="90" fill="rgba(0,122,255,0.22)"/>
    <rect x="306" y="170" width="116" height="90" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <!-- Coin in pocket -->
    <circle cx="364" cy="215" r="25" fill="rgba(255,214,10,0.88)" filter="url(#csh)"/>
    <text x="364" y="225" text-anchor="middle"
          font-family="-apple-system,Helvetica Neue,Arial,sans-serif"
          font-size="26" font-weight="700" fill="rgba(120,70,0,0.85)">₽</text>

    <!-- Card lines -->
    <rect x="114" y="192" width="164" height="10" rx="5" fill="rgba(255,255,255,0.40)"/>
    <rect x="114" y="214" width="110" height="8" rx="4" fill="rgba(255,255,255,0.20)"/>
    <rect x="114" y="234" width="132" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
    <rect x="114" y="274" width="84" height="32" rx="9" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

    <!-- Text БЮДЖЕТ -->
    <text x="256" y="388"
          text-anchor="middle"
          font-family="-apple-system,Helvetica Neue,Arial,sans-serif"
          font-size="82" font-weight="700"
          fill="white" letter-spacing="-2">БЮДЖЕТ</text>

    <!-- Text СЕМЬИ -->
    <text x="256" y="452"
          text-anchor="middle"
          font-family="-apple-system,Helvetica Neue,Arial,sans-serif"
          font-size="46" font-weight="400"
          fill="rgba(255,255,255,0.55)" letter-spacing="6">СЕМЬИ</text>
  </g>
</svg>
